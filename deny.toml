# cargo-deny configuration. Run with `cargo deny check`. Unset keys use cargo-deny defaults.

[graph]
all-features = true

[advisories]
ignore = [
    # `paste` is unmaintained (no vulnerability) and has no replacement upstream yet; it is a
    # build-time macro pulled in by alloy-primitives.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro, transitive via alloy-primitives" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
# The alloy / libp2p tree carries many duplicate versions; surface, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are path dependencies without versions.
allow-wildcard-paths = true
deny = [
    # Banned for our code; allowed only as a build-time dependency of prost's derive macro (libp2p).
    { name = "anyhow", wrappers = ["prost-derive"], reason = "use thiserror in libraries and eyre in the binary" },
    { name = "ethers", reason = "use alloy" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git dependencies, if one is ever needed, must be pinned to a tag or rev, never a branch.
required-git-spec = "tag"

[sources.allow-org]
github = ["paradigmxyz", "alloy-rs", "ethereum-optimism", "op-rs", "libp2p"]
