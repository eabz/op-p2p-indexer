# cargo-deny configuration. Run with `cargo deny check`. Unset keys use cargo-deny defaults.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
# The reth / alloy / libp2p tree carries many duplicate versions; surface, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are path dependencies without versions.
allow-wildcard-paths = true
deny = [
    { name = "anyhow", reason = "use thiserror in libraries and eyre in the binary" },
    { name = "ethers", reason = "use alloy" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git dependencies (reth, op-reth) must be pinned to a tag or rev, never a branch.
required-git-spec = "tag"

[sources.allow-org]
github = ["paradigmxyz", "alloy-rs", "ethereum-optimism", "op-rs", "libp2p"]
