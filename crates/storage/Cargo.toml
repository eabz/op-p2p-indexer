[package]
name = "op-indexer-storage"
description = "Block storage: unsafe blocks (in memory, journaled to fjall) and the committed block archive (fjall)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
op-indexer-primitives.workspace = true

alloy-consensus.workspace = true
alloy-rlp.workspace = true
alloy-primitives.workspace = true
fastrand.workspace = true
fjall.workspace = true
op-alloy-consensus.workspace = true
snap.workspace = true
thiserror.workspace = true
# `rt` for `spawn_blocking` (fjall is synchronous); `sync` for the archive's fair writer
# lock, so two writers' appends take turns batch by batch, and the unsafe chain's watch of its
# newest event; `macros` for the retry's `select!` on cancellation.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
# `CancellationToken`, which ends a retry.
tokio-util.workspace = true
tracing.workspace = true

[lints]
workspace = true
