[package]
name = "op-indexer-stream"
description = "gRPC stream of the chain: history from the block archive, then the live chain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-flight.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
op-indexer-primitives.workspace = true
op-indexer-storage.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
bytes.workspace = true
op-alloy-consensus.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
op-indexer-api.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[lints]
workspace = true

# Used by the generated code only (`tonic::include_proto!`), which cargo-machete does not read.
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost"]
