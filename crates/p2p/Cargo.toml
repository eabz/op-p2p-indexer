[package]
name = "op-indexer-p2p"
description = "OP Stack p2p: discv5 discovery, gossipsub block gossip, and unsafe-block validation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
op-indexer-chainspec.workspace = true
op-indexer-primitives.workspace = true

alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-engine.workspace = true
bytes.workspace = true
discv5.workspace = true
enr.workspace = true
ethereum_ssz.workspace = true
fjall.workspace = true
governor.workspace = true
libp2p = { workspace = true, features = ["ping", "request-response"] }
op-alloy-consensus.workspace = true
op-alloy-rpc-types-engine.workspace = true
sha2.workspace = true
snap.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
unsigned-varint.workspace = true

[lints]
workspace = true

# The crate's library name is `ssz`, which cargo-machete doesn't map back to `ethereum_ssz`.
[package.metadata.cargo-machete]
ignored = ["ethereum_ssz"]
