[package]
name = "op-indexer-balancer"
description = "Directory of the servers of a deployment: registration, health, Flight per-chunk jobs and Locate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy-primitives.workspace = true
arrow-flight.workspace = true
fastrand.workspace = true
futures-util.workspace = true
op-indexer-chainspec.workspace = true
op-indexer-chunks.workspace = true
op-indexer-api.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-stream = { workspace = true, features = ["time"] }
tokio-util = { workspace = true, features = ["rt"] }
# `channel`: the registration client a server runs.
tonic = { workspace = true, features = ["channel"] }
tonic-prost.workspace = true
tracing.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[lints]
workspace = true

# Used by the generated code only (`tonic::include_proto!`), which cargo-machete does not read.
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost"]
