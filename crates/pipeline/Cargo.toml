[package]
name = "op-indexer-pipeline"
description = "Indexing pipeline: writes unsafe blocks to the unsafe store and promotes them to the committed store once safe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
op-indexer-primitives.workspace = true
op-indexer-storage.workspace = true

# `secp256k1`: sender recovery on libsecp256k1, about five times faster than k256 (measured: 32
# against 148 us per transaction on one core); recovery bounds how fast a range is stored.
alloy-consensus = { workspace = true, features = ["secp256k1"] }
alloy-primitives.workspace = true
# The archive's header bytes, to compute our block's output root.
alloy-rlp.workspace = true
metrics.workspace = true
# `k256` implements sender recovery for `OpTxEnvelope`; it then runs on libsecp256k1 (above).
op-alloy-consensus = { workspace = true, features = ["k256"] }
thiserror.workspace = true
# `rt` for `spawn_blocking` and the task set: sender recovery is CPU work.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[lints]
workspace = true
