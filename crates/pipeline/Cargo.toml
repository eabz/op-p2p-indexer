[package]
name = "op-indexer-pipeline"
description = "Indexing pipeline: writes unsafe blocks to the unsafe store and promotes them to the committed store once safe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
op-indexer-primitives.workspace = true
op-indexer-storage.workspace = true

alloy-consensus.workspace = true
alloy-primitives.workspace = true
# The archive's header bytes, to compute our block's output root.
alloy-rlp.workspace = true
metrics.workspace = true
# `k256` implements sender recovery for `OpTxEnvelope`.
op-alloy-consensus = { workspace = true, features = ["k256"] }
thiserror.workspace = true
# `rt` for `spawn_blocking` and the task set: sender recovery is CPU work.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[lints]
workspace = true
