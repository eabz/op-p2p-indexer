[package]
name = "op-indexer-bench"
description = "Bounded Arrow Flight benchmark client with coverage validation and workload reports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
op-indexer-api.workspace = true
arrow-array.workspace = true
arrow-flight.workspace = true
# Enable both IPC decoders, including when built without the server crates.
arrow-ipc.workspace = true
arrow-schema.workspace = true
fastrand.workspace = true
futures-util.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util.workspace = true
tonic = { workspace = true, features = ["channel"] }
tracing.workspace = true

[package.metadata.cargo-machete]
ignored = ["arrow-ipc"] # Enables Flight IPC decompression through feature unification.

[lints]
workspace = true
