name: Check website and documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/website-check.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/website-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements-check.txt
      - run: python -m pip install -r website/requirements-check.txt
      - run: node --check website/dist/app.js
      - run: python website/build.py
      - run: bash -n website/.site/install.sh
      - run: python website/check_links.py
      - run: python website/check_examples.py
