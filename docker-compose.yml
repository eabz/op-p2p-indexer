# Local test stack: the indexer plus its two storage layers.
#
#   Redis      — unsafe blocks: received over gossip, not yet committed to L1.
#   ClickHouse — committed blocks: safe/finalized, whose batches are on L1.
#
# Credentials below are for local testing only. Override them via environment or a `.env` file.
#
#   docker compose up -d redis clickhouse    # storage only, run the indexer with `cargo run`
#   docker compose up --build                # everything in containers

name: op-p2p-indexer

services:
  indexer:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Empty means "use the default".
      OP_INDEXER_CHAIN_ID: ${OP_INDEXER_CHAIN_ID:-}
      OP_INDEXER_LISTEN_ADDR: ${OP_INDEXER_LISTEN_ADDR:-}
      OP_INDEXER_BOOTNODES: ${OP_INDEXER_BOOTNODES:-}
      OP_INDEXER_MAX_PEERS: ${OP_INDEXER_MAX_PEERS:-}
      # Storage: at startup the binary connects to both stores, checks the Redis key-layout
      # version and runs the ClickHouse migrations, and exits if either store is unreachable.
      OP_INDEXER_REDIS_URL: redis://redis:6379
      OP_INDEXER_CLICKHOUSE_URL: http://clickhouse:8123
      OP_INDEXER_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-op_indexer}
      OP_INDEXER_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-indexer}
      OP_INDEXER_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-indexer}
      # Blocks kept in the local archive (the archive directory in the data volume): a block
      # count, `all` to keep every block, or 0 to disable it. Empty means 30 days.
      OP_INDEXER_ARCHIVE_RETENTION_BLOCKS: ${OP_INDEXER_ARCHIVE_RETENTION_BLOCKS:-}
      # Execution p2p (devp2p), which fetches the receipts gossip does not carry. Off unless
      # OP_INDEXER_EL_ENABLED is true; the others only apply then.
      OP_INDEXER_EL_ENABLED: ${OP_INDEXER_EL_ENABLED:-}
      OP_INDEXER_EL_LISTEN_ADDR: ${OP_INDEXER_EL_LISTEN_ADDR:-}
      OP_INDEXER_EL_BOOTNODES: ${OP_INDEXER_EL_BOOTNODES:-}
      # The host's public IP and port, so peers can dial back; the container only sees its
      # own bridge address.
      OP_INDEXER_EL_ADVERTISED_ADDR: ${OP_INDEXER_EL_ADVERTISED_ADDR:-}
      # true: fetch every block between the archive's last block and the chain's head from
      # execution peers, once. Needs OP_INDEXER_ARCHIVE_RETENTION_BLOCKS=all.
      OP_INDEXER_EL_SYNC: ${OP_INDEXER_EL_SYNC:-}
      # true: follow Ethereum L1 for what it commits to, and promote on it. Needs the
      # checkpoint: the root of a recent finalized beacon block, from a source you trust.
      OP_INDEXER_L1_ENABLED: ${OP_INDEXER_L1_ENABLED:-}
      OP_INDEXER_L1_CHECKPOINT: ${OP_INDEXER_L1_CHECKPOINT:-}
      OP_INDEXER_L1_LISTEN_ADDR: ${OP_INDEXER_L1_LISTEN_ADDR:-}
      OP_INDEXER_L1_BEACON_LISTEN_ADDR: ${OP_INDEXER_L1_BEACON_LISTEN_ADDR:-}
      OP_INDEXER_L1_ADVERTISED_ADDR: ${OP_INDEXER_L1_ADVERTISED_ADDR:-}
    ports:
      - "9222:9222/tcp"
      - "9222:9222/udp"
      # Execution p2p; unused while it is disabled.
      - "30303:30303/tcp"
      - "30303:30303/udp"
      - "30304:30304/tcp"
      - "30304:30304/udp"
      - "9001:9001/tcp"
      - "9001:9001/udp"
    volumes:
      # The data directory (the image sets OP_INDEXER_DATA_DIR=/data): `node/` holds the node
      # identity and known peers, `archive/` the local block archive.
      - indexer-data:/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-op_indexer}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-indexer}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-indexer}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native protocol
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  indexer-data:
  redis-data:
  clickhouse-data:
