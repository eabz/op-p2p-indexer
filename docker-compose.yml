# Local test stack: the indexer, which needs no other service.
#
#   unsafe chain    — blocks received over gossip, not yet committed to L1: in the indexer's
#                     memory, journaled to `unsafe/` in its data volume.
#   archive (fjall) — committed blocks, in the indexer's data volume.
#
#   docker compose up --build
#
# Several indexers on one host (another chain, or another build of one): give each its own
# project name and an env file that shifts its ports and its data directory. See
# unichain.env.example and docs/storage.md, "Several instances on one host":
#
#   docker compose -p unichain --env-file unichain.env.example up -d

name: op-p2p-indexer

services:
  indexer:
    build: .
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Empty means "use the default".
      OP_INDEXER_CHAIN_ID: ${OP_INDEXER_CHAIN_ID:-}
      # Every listen port is the same inside the container and on the host, so the node
      # records advertise the port peers can reach. Shift them all for a second instance.
      OP_INDEXER_LISTEN_ADDR: 0.0.0.0:${OP_INDEXER_P2P_PORT:-9222}
      # The host's public IP and port, so consensus-layer peers can dial back; the container
      # only sees its own bridge address.
      OP_INDEXER_ADVERTISED_ADDR: ${OP_INDEXER_ADVERTISED_ADDR:-}
      OP_INDEXER_BOOTNODES: ${OP_INDEXER_BOOTNODES:-}
      OP_INDEXER_MAX_PEERS: ${OP_INDEXER_MAX_PEERS:-}
      # Storage: at startup the binary opens the block archive and the unsafe chain's journal,
      # which it replays; it exits if either is another chain's. The memory the unsafe
      # chain's blocks may take (default 2 GiB).
      OP_INDEXER_UNSAFE_MAX_BYTES: ${OP_INDEXER_UNSAFE_MAX_BYTES:-}
      # Execution p2p (devp2p), which fetches the receipts gossip does not carry. Off unless
      # OP_INDEXER_EL_ENABLED is true; the others only apply then.
      OP_INDEXER_EL_ENABLED: ${OP_INDEXER_EL_ENABLED:-}
      OP_INDEXER_EL_LISTEN_ADDR: 0.0.0.0:${OP_INDEXER_EL_PORT:-30303}
      OP_INDEXER_EL_BOOTNODES: ${OP_INDEXER_EL_BOOTNODES:-}
      # The host's public IP and port, so peers can dial back; the container only sees its
      # own bridge address.
      OP_INDEXER_EL_ADVERTISED_ADDR: ${OP_INDEXER_EL_ADVERTISED_ADDR:-}
      # true: fetch every block between the archive's last block and the chain's head from
      # execution peers, once. Needs the archive to keep every block (the default).
      OP_INDEXER_EL_SYNC: ${OP_INDEXER_EL_SYNC:-}
      # true: follow Ethereum L1 for what it commits to, and promote on it. Needs the
      # checkpoint: the root of a recent finalized beacon block, from a source you trust,
      # and the range sync (OP_INDEXER_EL_SYNC=true with OP_INDEXER_EL_ENABLED=true).
      OP_INDEXER_L1_ENABLED: ${OP_INDEXER_L1_ENABLED:-}
      OP_INDEXER_L1_CHECKPOINT: ${OP_INDEXER_L1_CHECKPOINT:-}
      OP_INDEXER_L1_LISTEN_ADDR: 0.0.0.0:${OP_INDEXER_L1_PORT:-30304}
      OP_INDEXER_L1_BEACON_LISTEN_ADDR: 0.0.0.0:${OP_INDEXER_L1_BEACON_PORT:-9001}
      OP_INDEXER_L1_ADVERTISED_ADDR: ${OP_INDEXER_L1_ADVERTISED_ADDR:-}
      # The gRPC stream. No authentication and no TLS: published on the host's loopback
      # unless OP_INDEXER_STREAM_HOST_BIND says otherwise (e.g. 0.0.0.0).
      OP_INDEXER_STREAM_LISTEN_ADDR: 0.0.0.0:${OP_INDEXER_STREAM_PORT:-50051}
      OP_INDEXER_STREAM_MAX_SUBSCRIPTIONS: ${OP_INDEXER_STREAM_MAX_SUBSCRIPTIONS:-}
      OP_INDEXER_STREAM_MAX_FLIGHTS: ${OP_INDEXER_STREAM_MAX_FLIGHTS:-}
    ports:
      - "${OP_INDEXER_P2P_PORT:-9222}:${OP_INDEXER_P2P_PORT:-9222}/tcp"
      - "${OP_INDEXER_P2P_PORT:-9222}:${OP_INDEXER_P2P_PORT:-9222}/udp"
      # The chain's execution p2p; unused unless OP_INDEXER_EL_ENABLED=true.
      - "${OP_INDEXER_EL_PORT:-30303}:${OP_INDEXER_EL_PORT:-30303}/tcp"
      - "${OP_INDEXER_EL_PORT:-30303}:${OP_INDEXER_EL_PORT:-30303}/udp"
      # L1: execution p2p and the beacon light client; unused unless OP_INDEXER_L1_ENABLED=true.
      - "${OP_INDEXER_L1_PORT:-30304}:${OP_INDEXER_L1_PORT:-30304}/tcp"
      - "${OP_INDEXER_L1_PORT:-30304}:${OP_INDEXER_L1_PORT:-30304}/udp"
      - "${OP_INDEXER_L1_BEACON_PORT:-9001}:${OP_INDEXER_L1_BEACON_PORT:-9001}/tcp"
      - "${OP_INDEXER_L1_BEACON_PORT:-9001}:${OP_INDEXER_L1_BEACON_PORT:-9001}/udp"
      # The gRPC stream.
      - "${OP_INDEXER_STREAM_HOST_BIND:-127.0.0.1}:${OP_INDEXER_STREAM_PORT:-50051}:${OP_INDEXER_STREAM_PORT:-50051}/tcp"
    volumes:
      # The data directory (the image sets OP_INDEXER_DATA_DIR=/data): `node/` holds the node
      # identity and known peers, `archive/` the block archive, `unsafe/` the unsafe chain's
      # journal. It is a host directory named
      # after the chain, `./data-op` by default and `./data-unichain` in unichain.env.example,
      # the same names the node uses outside Docker. The container runs as
      # uid 10001: create it once with `mkdir -p data-op && chown 10001:10001 data-op`.
      - ${OP_INDEXER_HOST_DATA_DIR:-./data-op}:/data
