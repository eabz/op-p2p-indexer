[workspace]
members = ["bin/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Internal crates.
op-indexer-p2p = { path = "crates/p2p" }
op-indexer-pipeline = { path = "crates/pipeline" }
op-indexer-primitives = { path = "crates/primitives" }
op-indexer-storage = { path = "crates/storage" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Panics on untrusted (network) input are bugs. Allowed in tests via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"

# Logging goes through `tracing`.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Errors and shared state.
map_err_ignore = "warn"
let_underscore_must_use = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"

# Structure.
mod_module_files = "warn"
wildcard_enum_match_arm = "warn"

# Explicit, reasoned suppressions only: `#[expect(lint, reason = "...")]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Pedantic lint that is too noisy for this codebase.
must_use_candidate = "allow"
