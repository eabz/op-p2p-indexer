[workspace]
members = ["bin/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates.
op-indexer-balancer = { path = "crates/balancer" }
op-indexer-chainspec = { path = "crates/chainspec" }
op-indexer-chunks = { path = "crates/chunks" }
op-indexer-el = { path = "crates/el" }
op-indexer-l1 = { path = "crates/l1" }
op-indexer-node = { path = "crates/node" }
op-indexer-p2p = { path = "crates/p2p" }
op-indexer-pipeline = { path = "crates/pipeline" }
op-indexer-server = { path = "crates/server" }
op-indexer-primitives = { path = "crates/primitives" }
op-indexer-storage = { path = "crates/storage" }
op-indexer-stream = { path = "crates/stream" }

# Ethereum types; `k256` for sequencer signature recovery.
alloy-primitives = { version = "1.7", default-features = false, features = ["std", "k256"] }
# Cheaply cloneable payload buffers passed between tasks.
bytes = "1"
# Block, transaction and receipt types, so no crate redefines them.
alloy-consensus = { version = "2", default-features = false, features = ["std"] }
op-alloy-consensus = { version = "2", default-features = false, features = ["std"] }
# RLP of headers, bodies and receipts in the block archive, the encoding peers ask for
# (already in the tree through alloy).
alloy-rlp = { version = "0.3", default-features = false, features = ["std"] }
# The EIP-2718 encodings and the EIP-7702 authorization lists.
alloy-eips = { version = "2", default-features = false, features = ["std"] }
# Ethereum mainnet's hardfork schedule, for the fork id the `l1` crate shows L1 peers.
alloy-hardforks = { version = "0.4", default-features = false }

# TCP + Noise + yamux transport with a secp256k1 identity, gossipsub for block gossip,
# `macros` to compose gossipsub with connection limits.
libp2p = { version = "0.57", default-features = false, features = ["tcp", "tokio", "noise", "yamux", "secp256k1", "gossipsub", "macros"] }
# Node discovery (same protocol and crate as Lighthouse and reth); `libp2p` to request the ENR
# of `enode://` bootnodes by their multiaddr.
discv5 = { version = "0.12", features = ["libp2p"] }
# ENR key types for our own record (discv5 re-exports only the `Enr` alias).
enr = { version = "0.14", default-features = false, features = ["k256"] }
# Already in the tree via multiaddr; used for the `opstack` ENR entry.
unsigned-varint = "0.8"

# Execution p2p (`crates/el`): RLPx (ECIES transport, p2p hello) and the eth wire handshake and
# message types. reth's crates exist on crates.io only as 0.0.0 placeholders, so they come from
# git, pinned to a release tag; only the four crates `el` calls. No published alternative is
# maintained, and hand-writing the encrypted transport is not an option we want.
reth-ecies = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-eth-wire = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-eth-wire-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
# The fork id (EIP-2124) peers check in the node record and the eth status.
alloy-eip2124 = { version = "0.2", default-features = false, features = ["std"] }
# The node key type reth's transport takes (same version as reth).
secp256k1 = { version = "0.30", default-features = false, features = ["std", "global-context", "recovery"] }
# Peer id of an `enode://` bootnode, to ask it for its node record (already in the tree through
# libp2p and discv5).
libp2p-identity = { version = "0.2", default-features = false, features = ["secp256k1", "peerid"] }
# `StreamExt` / `SinkExt` to drive reth's p2p stream.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# Embedded store for the node state (p2p) and the local block archive (storage): pure Rust,
# log-structured, one directory per store. Its only default feature, `lz4`, is off: archived
# values are already snappy-compressed and the node state is tiny.
fjall = { version = "3.1", default-features = false }
# OP execution payload SSZ types and the sequencer signing message.
op-alloy-rpc-types-engine = { version = "2", default-features = false, features = ["std"] }
alloy-rpc-types-engine = { version = "2", default-features = false, features = ["ssz"] }
# The `Decode` trait and error for the payload SSZ types (same version op-alloy uses).
ethereum_ssz = { version = "0.10", default-features = false }
# Beacon light client (`crates/l1`): derived SSZ decoding, hash tree roots and the fixed-size
# SSZ collections of the consensus types (all sigp's, as `ethereum_ssz`).
ethereum_ssz_derive = "0.10"
tree_hash = "0.12"
tree_hash_derive = "0.12"
ssz_types = { version = "0.14", default-features = false }
# BLS12-381 signatures of the sync committee (already in the tree through alloy's KZG).
blst = { version = "0.3", default-features = false }
# Gossip payloads and archived blocks are snappy block-compressed; gossip message IDs are
# SHA-256 (0.10, as op-alloy).
sha2 = "0.10"
# Constant-time comparison of API keys (the stream).
subtle = { version = "2.6", default-features = false }
snap = "1.1"

# The importer's state files are JSON.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

# Async runtime; each crate enables only the features it uses.
tokio = { version = "1", default-features = false }
# `CancellationToken` for shutdown.
tokio-util = { version = "0.7", default-features = false }

# Errors: `eyre` in the binary, `thiserror` in the libraries.
eyre = "0.6"
thiserror = "2"
# Structured logging.
tracing = "0.1"
# Jitter: storage's retry backoff, the importer's download retries, and the peer schedules of
# `el` and `l1` (already in the tree through fjall).
fastrand = { version = "2", default-features = false, features = ["std"] }
# Log output in the binary; `chrono` for the short UTC timestamps.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "chrono"] }

# Stream (`crates/stream`): the gRPC server (tonic, its prost codec, prost for the messages)
# and, at build time, a protobuf compiler written in Rust (protox), so no system `protoc` is
# needed.
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server"] }
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false }
protox = "0.9"
# `ReceiverStream`: a subscription's queue as the response stream.
tokio-stream = { version = "0.1", default-features = false }
# Rate limits of the consensus layer's `payload_by_number` server (GCRA, as op-node's):
# `std` only, no dashmap, quanta or jitter.
governor = { version = "0.10", default-features = false, features = ["std"] }
# Arrow Flight for bulk history as columnar record batches: the Apache crate (same tonic and
# prost as the stream), no default features; arrow-array and arrow-schema to build the batches.
arrow-flight = { version = "60", default-features = false }
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
# `IpcWriteOptions` for the schemas Flight answers with.
arrow-ipc = { version = "60", default-features = false }

# Importer (`bin/op-indexer-import`) only. Command line: flags with environment fallbacks and
# generated help.
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
# HTTPS client for the archive service. No decompression features: answers are stored as they
# travel. No HTTP/2: every request gets its own connection.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Decoding of gzip answers when the service does not send zstd (already in the tree).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Free space of the state directory's filesystem and the open-files limit (already in the
# tree; std has no call for either).
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
# Compression of the downloaded and verified chunks on disk (already in the tree).
zstd = { version = "0.13", default-features = false }
# Object storage (Cloudflare R2, through its S3 API) for sealed block chunks, in `crates/chunks`
# only: Apache Arrow's maintained client, with pooled keep-alive connections over reqwest and
# ranged GETs; `aws` is the S3 backend (no Azure, GCP or HTTP), `fs` a local directory with the
# same layout, for tests and the bench without credentials.
object_store = { version = "0.14", default-features = false, features = ["aws", "fs"] }
# The importer's allocator: `verify` builds rows and receipts on every core at once, and is
# about 9% faster with it at eight threads than with the system allocator.
mimalloc = { version = "0.1", default-features = false }
# Reads the `.env` file each binary loads at startup (`NAME=value` lines, the process
# environment winning); maintained fork of `dotenv`, no dependencies.
dotenvy = { version = "0.15", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Panics on untrusted (network) input are bugs.
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"

# Logging goes through `tracing`.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Errors and shared state.
map_err_ignore = "warn"
let_underscore_must_use = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"

# Structure.
mod_module_files = "warn"
wildcard_enum_match_arm = "warn"

# Explicit, reasoned suppressions only: `#[expect(lint, reason = "...")]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Pedantic lint that is too noisy for this codebase.
must_use_candidate = "allow"
